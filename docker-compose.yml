version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_VERSION=20
    image: museo-app:latest
    container_name: museo-app
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DEBUG=${DEBUG:-false}
      - NEXT_PUBLIC_DOMAIN=${NEXT_PUBLIC_DOMAIN:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:-change_me}
      - DB_PROVIDER=${DB_PROVIDER:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-file:/app/data.sqlite}
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:-pass}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:3000}
      - STAGING_API_BASE_URL=${STAGING_API_BASE_URL:-http://staging.example.com}
      - PRODUCTION_API_BASE_URL=${PRODUCTION_API_BASE_URL:-https://api.example.com}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
      mongo:
        condition: service_healthy
    profiles: ["app"]

  postgres:
    image: postgres:16-alpine
    container_name: museo-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-museum}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-museumpass}
      - POSTGRES_DB=${POSTGRES_DB:-museum}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-museum} -d ${POSTGRES_DB:-museum}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    profiles: ["postgres"]

  mysql:
    image: mysql:8.4
    container_name: museo-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-museum}
      - MYSQL_USER=${MYSQL_USER:-museum}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-museumpass}
    command: ["--default-authentication-plugin=mysql_native_password"]
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -hmysql -u${MYSQL_USER:-museum} -p${MYSQL_PASSWORD:-museumpass} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysqldata:/var/lib/mysql
    profiles: ["mysql"]

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: museo-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD:-StrongPass123!}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P ${SA_PASSWORD:-StrongPass123!} -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - mssqldata:/var/opt/mssql
    profiles: ["sqlserver"]

  mongo:
    image: mongo:7
    container_name: museo-mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-museum}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-museumpass}
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --username ${MONGO_INITDB_ROOT_USERNAME:-museum} --password ${MONGO_INITDB_ROOT_PASSWORD:-museumpass} --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - mongodata:/data/db
    profiles: ["mongo"]

volumes:
  uploads:
  pgdata:
  mysqldata:
  mssqldata:
  mongodata:
